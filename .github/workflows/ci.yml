# ──────────────────────────────────────────────────────────────
# Raichu CI Pipeline
#
# Runs on every push to main and on pull requests.
# Uses pnpm workspaces + Turborepo to build and test the full
# monorepo (packages/* and apps/*).
#
# Lint step is intentionally skipped — no package in this repo
# defines a lint script yet. Add ESLint configs and per-package
# "lint" scripts, then uncomment the lint step below.
#
# apps/web declares a test script but has no test files today;
# vitest exits 0 in that case so it is safe to include.
#
# iOS engine bundle (Phase 0.2):
#   After the full build, `pnpm build:ios` uses esbuild to bundle
#   @raichu/game-engine + @raichu/ai-engine into a single IIFE JS
#   file (raichu-engine.js) for JavaScriptCore on iOS.
#   The bundle is uploaded as a workflow artifact on every main push.
# ──────────────────────────────────────────────────────────────

name: CI

on:
  # Run on pushes to main branch
  push:
    branches: [main]
  # Run on all pull requests
  pull_request:

# Cancel redundant runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout the repository ──────────────────────────
      - name: Checkout code
        uses: actions/checkout@v6

      # ── 2. Set up pnpm (matches packageManager in root package.json) ──
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.0

      # ── 3. Set up Node.js with pnpm dependency cache ───────
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      # ── 4. Install dependencies (frozen lockfile for reproducibility) ──
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 5. Lint ─────────────────────────────────────────────
      # Skipped: no package in this repo defines a "lint" script.
      # The root "pnpm lint" runs "turbo lint" but every workspace
      # is a no-op. Uncomment once ESLint is configured.
      #
      # - name: Lint
      #   run: pnpm lint

      # ── 6. Build all packages and apps ──────────────────────
      # Turborepo builds in dependency order:
      #   shared-types -> game-engine -> ai-engine -> api / web
      - name: Build
        run: pnpm build

      # ── 7. Run tests across the monorepo ────────────────────
      # Packages with tests: game-engine, ai-engine, api, web
      # (web has no test files yet — vitest exits 0 safely)
      - name: Test
        run: pnpm test

      # ── 8. Build iOS JavaScriptCore engine bundle ───────────
      # Bundles @raichu/game-engine + @raichu/ai-engine into a
      # single IIFE for JSContext. Requires step 6 (packages built).
      # esbuild is a root devDependency installed in step 4.
      - name: Build iOS engine bundle
        run: pnpm build:ios

      # ── 9. Upload iOS bundle as workflow artifact ───────────
      # Lets you download raichu-engine.js from the Actions UI
      # and drop it into Xcode without running the build locally.
      - name: Upload iOS engine bundle
        uses: actions/upload-artifact@v4
        with:
          name: raichu-engine-js
          path: apps/Ios-app/Raichu/Raichu/Engine/raichu-engine.js
          if-no-files-found: error
